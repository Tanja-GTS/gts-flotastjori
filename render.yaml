services:
  - type: web
    name: fleet-scheduler
    env: node
    plan: starter
    autoDeploy: true

    # Build + start from the repo root so we can build the Vite frontend.
    rootDir: .

    # Build: install deps (including devDeps for Vite), build Vite frontend into ./dist, and copy into backend/dist
    buildCommand: npm install --include=dev && npm run render:build

    # Start: run the Express backend in "single-service" mode (serves frontend + /api)
    startCommand: npm run render:start

    # Render will call this to know the service is up.
    healthCheckPath: /health

    envVars:
      # Serve the built frontend from the same service
      - key: SERVE_FRONTEND
        value: "true"

      # Required in production (single-origin hosting)
      - key: APP_ORIGIN
        value: https://gts-flotastjori.onrender.com

      # Entra API auth (recommended)
      - key: AUTH_ENABLED
        # Keep this off until Entra login is confirmed working end-to-end.
        # When you want to require sign-in for /api/*, set this to "true".
        value: "false"

      # Optional: temporarily allow unauthenticated /api/debug/* while troubleshooting
      - key: PUBLIC_DEBUG_ENDPOINTS
        value: "false"
      - key: ENTRA_TENANT_ID
        sync: false
      - key: ENTRA_API_AUDIENCE
        sync: false
      - key: ENTRA_REQUIRED_SCOPE
        value: access_as_user

      # Frontend (Vite) build-time Entra vars (required for the Sign-in screen)
      - key: VITE_ENTRA_TENANT_ID
        sync: false
      - key: VITE_ENTRA_CLIENT_ID
        sync: false
      - key: VITE_ENTRA_API_SCOPE
        sync: false

      # Microsoft Graph (app-only) for Lists + mail
      - key: AZURE_TENANT_ID
        sync: false
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false

      - key: MS_SITE_ID
        sync: false
      - key: MS_SHIFT_INSTANCES_LIST_ID
        sync: false
      - key: MS_SHIFT_PATTERNS_LIST_ID
        sync: false

      # Required if your Templates don't provide BusLookupId (ShiftInstances.busId is required)
      # This should be the *lookup item ID* in your Buses list (often a small integer like "1").
      - key: DEFAULT_BUS_LOOKUP_ID
        sync: false

      # Buses list: internal column name for the license plate field
      - key: BUSES_FIELD_PLATE
        value: "field_1"

      # ShiftInstances column internal-name overrides (Microsoft Lists often uses field_#)
      - key: LIST_FIELD_WORKSPACE_ID
        sync: false
      - key: LIST_FIELD_DATE
        sync: false
      - key: LIST_FIELD_TEMPLATE_ID
        sync: false
      - key: LIST_FIELD_PATTERN_ID
        sync: false
      - key: LIST_FIELD_DRIVER_ID
        sync: false
      - key: LIST_FIELD_BUS_ID
        sync: false
      - key: LIST_FIELD_CONFIRMATION_STATUS
        sync: false
      - key: LIST_FIELD_NOTES
        sync: false
      - key: LIST_FIELD_GENERATED
        sync: false
      - key: LIST_FIELD_MANUAL_OVERRIDE
        sync: false

      # Automatically materialize missing ShiftInstances when a month is opened.
      - key: AUTO_GENERATE_SHIFTS_ON_READ
        value: "true"

      # Keep hydrated month responses warm for managers opening the same months repeatedly.
      # Writes already invalidate this cache explicitly.
      - key: CACHE_SHIFTS_TTL_MS
        value: "1800000"

      - key: WARMUP_WORKSPACES
        value: "south"

      # Automatically pull Timon assignment changes when a month is opened.
      # Disabled in production because it makes month opening feel too slow.
      # Timon still syncs every day via the dedicated 04:00 UTC cron job.
      - key: AUTO_TIMON_SYNC_ON_READ
        value: "false"
      - key: AUTO_TIMON_SYNC_COOLDOWN_MS
        value: "1800000"

      # Optional: email sender UPN (only needed if using Graph sendMail)
      - key: MAIL_SENDER_UPN
        sync: false

      # Required: used to sign/verify email confirmation links (/confirm/:token)
      # IMPORTANT: keep it stable across deploys or previously sent links will break.
      - key: CONFIRM_LINK_SECRET
        sync: false

      # Optional: confirmation link expiry in days (default: 30)
      - key: CONFIRM_LINK_TTL_DAYS
        value: "30"

  - type: cron
    name: fleet-scheduler-timon-sync
    env: node
    plan: starter
    rootDir: .
    schedule: "0 4 * * *"
    buildCommand: npm install --include=dev && npm run render:build
    startCommand: npm --prefix backend run timon:sync
    envVars:
      - key: AZURE_TENANT_ID
        sync: false
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: MS_SITE_ID
        sync: false
      - key: MS_SHIFT_INSTANCES_LIST_ID
        sync: false
      - key: MS_SHIFT_PATTERNS_LIST_ID
        sync: false
      - key: MS_BUSES_LIST_ID
        sync: false
      - key: MS_ROUTES_LIST_ID
        sync: false
      - key: MS_TEMPLATES_LIST_ID
        sync: false
      - key: MS_DRIVERS_LIST_ID
        sync: false
      - key: MS_TRIP_TEMPLATES_LIST_ID
        sync: false
      - key: MS_STOPS_TEMPLATE_LIST_ID
        sync: false
      - key: DEFAULT_BUS_LOOKUP_ID
        sync: false
      - key: LIST_FIELD_WORKSPACE_ID
        sync: false
      - key: LIST_FIELD_DATE
        sync: false
      - key: LIST_FIELD_TEMPLATE_ID
        sync: false
      - key: LIST_FIELD_PATTERN_ID
        sync: false
      - key: LIST_FIELD_DRIVER_ID
        sync: false
      - key: LIST_FIELD_BUS_ID
        sync: false
      - key: LIST_FIELD_CONFIRMATION_STATUS
        sync: false
      - key: LIST_FIELD_NOTES
        sync: false
      - key: LIST_FIELD_GENERATED
        sync: false
      - key: LIST_FIELD_MANUAL_OVERRIDE
        sync: false
      - key: LIST_FIELD_EXTERNAL_SOURCE
        sync: false
      - key: LIST_FIELD_EXTERNAL_SHIFT_ID
        sync: false
      - key: LIST_FIELD_EXTERNAL_EMPLOYEE_SSN
        sync: false
      - key: LIST_FIELD_EXTERNAL_EMPLOYEE_NAME
        sync: false
      - key: LIST_FIELD_EXTERNAL_SHIFT_NAME
        sync: false
      - key: LIST_FIELD_EXTERNAL_ARR
        sync: false
      - key: LIST_FIELD_EXTERNAL_DEP
        sync: false
      - key: LIST_FIELD_LAST_SYNCED_AT
        sync: false
      - key: DRIVER_FIELD_SSN
        sync: false
      - key: PATTERN_FIELD_ROUTE
        sync: false
      - key: PATTERN_FIELD_ROUTE_NAME
        sync: false
      - key: PATTERN_FIELD_TIMON_ROUTE_CODE
        sync: false
      - key: PATTERN_FIELD_TIMON_SHIFT_NAME
        sync: false
      - key: PATTERN_FIELD_SHIFT_TYPE
        sync: false
      - key: PATTERN_FIELD_WEEK_PART
        sync: false
      - key: PATTERN_FIELD_DAY_OF_WEEK
        sync: false
      - key: PATTERN_FIELD_START_TIME
        sync: false
      - key: PATTERN_FIELD_END_TIME
        sync: false
      - key: PATTERN_FIELD_WORKSPACE_ID
        sync: false
      - key: PATTERN_FIELD_TEMPLATE_ID
        sync: false
      - key: TEMPLATE_FIELD_ROUTE_NAME
        sync: false
      - key: TEMPLATE_FIELD_TIMON_ROUTE_CODE
        sync: false
      - key: TEMPLATE_FIELD_TIMON_SHIFT_NAME
        sync: false
      - key: TIMON_API_BASE_URL
        sync: false
      - key: TIMON_API_TOKEN
        sync: false
      - key: TIMON_API_TOKEN_HEADER
        sync: false
      - key: TIMON_API_TOKEN_PREFIX
        sync: false
      - key: TIMON_SYNC_WORKSPACE
        value: "south"
      - key: TIMON_SYNC_LOOKBACK_MONTHS
        value: "1"
      - key: TIMON_SYNC_LOOKAHEAD_MONTHS
        value: "0"
      - key: TIMON_SYNC_DRY_RUN
        value: "false"

  - type: cron
    name: fleet-scheduler-cache-warmup
    env: node
    plan: starter
    rootDir: .
    # 5:55 AM UTC = ~5 minutes before fleet managers arrive at 6 AM (Iceland is UTC+0 year-round).
    # Wakes the web service from Render's idle sleep and pre-populates the in-memory shift cache.
    schedule: "55 5 * * *"
    buildCommand: npm install --include=dev && npm run render:build
    startCommand: npm --prefix backend run warmup:cache
    envVars:
      - key: APP_ORIGIN
        value: https://gts-flotastjori.onrender.com
